<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>body{margin:0}</style>
<title>Кровавый манекен</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap">
<style>
/* layout: full-screen canvas, score on top, tool bar at the bottom */
:root{--bg:#140c0c;--fg:#f2e3c6;--panel:#33201c;--blood:#a80010;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{min-height:480px}
body{background:var(--bg);color:var(--fg);font:600 14px "Pixelify Sans",monospace;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header,nav{flex:none;display:flex;gap:8px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{justify-content:space-between;font-variant-numeric:tabular-nums}
#wrap{flex:1;min-height:360px;position:relative}
canvas{image-rendering:pixelated;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
nav{flex-wrap:wrap}
nav button{font-size:12px}
button{flex:1 0 22%;padding:0 2px;min-width:0;min-height:44px;border:2px solid #7a5540;border-radius:0;box-shadow:inset 0 -3px #0007;background:var(--panel);color:var(--fg);font:inherit;touch-action:manipulation}
header button{flex:0 0 auto;padding:0 14px}
button[aria-pressed="true"]{background:var(--blood)}
button:focus-visible{outline:2px solid var(--fg)}
</style>
<header><span>Урон: <b id="score">0</b><br>Рекорд: <b id="best">0</b></span><button id="snd" aria-pressed="false">Звук: вкл</button><button id="reset">Заново</button></header>
<div id="wrap"><canvas id="c" aria-label="Игровое поле с манекеном"></canvas></div>
<nav>
<button data-t="hand" aria-pressed="true">Рука</button>
<button data-t="saw" aria-pressed="false">Пила</button>
<button data-t="gun" aria-pressed="false">Пушка</button>
<button data-t="bomb" aria-pressed="false">Бомба</button>
<button data-t="hammer" aria-pressed="false">Молот</button>
<button id="spikes" aria-pressed="false">Шипы</button>
<button id="blade" aria-pressed="false">Циркулярка</button>
<button id="grav" aria-pressed="false">Невесомость</button>
</nav>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),stain=document.createElement('canvas'),sg=stain.getContext('2d');
let W=0,H=0,D=1,P=[],S=[],drops=[],bombs=[],flashes=[],score=0,shake=0,tool='hand';
const grabs=new Map();
let drips=[],pool=0,spilled=false;
let spikes=false,blade=false,zero=false,spin=0,mute=false,AC=null,noise=null,best=0;const played={};
try{best=+localStorage.getItem('ragdollBest')||0}catch(_){}
function audio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();noise=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state!=='running')AC.resume()}catch(_){}}
for(const n of ['pointerdown','touchend','click'])addEventListener(n,audio,true);
// name: [noise filter Hz, tone from Hz, tone to Hz, seconds, volume]
const SFX={hit:[500,150,50,.18,.5],cut:[3500,500,120,.2,.4],gun:[2500,200,40,.15,.6],boom:[300,90,25,.7,.9],hammer:[700,110,35,.3,.8],drop:[0,700,300,.12,.2]};
function sfx(n){
 if(mute||!AC)return;const t=AC.currentTime;if(t-(played[n]||0)<.07)return;played[n]=t;
 const [hz,f0,f1,len,vol]=SFX[n];
 const out=(src)=>{const v=AC.createGain();v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+len);src.connect(v);v.connect(AC.destination);src.start(t);src.stop(t+len)};
 const o=AC.createOscillator();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+len);out(o);
 if(hz){const b=AC.createBufferSource();b.buffer=noise;const q=AC.createBiquadFilter();q.type='lowpass';q.frequency.value=hz;b.connect(q);out({connect:x=>q.connect(x),start:a=>b.start(a),stop:a=>b.stop(a)})}
}
const saw=()=>({x:W/2+Math.sin(spin*.12)*W*.32,y:H*.68,r:30});
function hammer(x,y){
 sfx('hammer');flashes.push({x,y,r:45,t:8});shake=10;
 for(const p of P){const d=Math.hypot(p.x-x,p.y-y);if(d<75){p.py-=18*(1-d/90);p.px+=(Math.random()-.5)*10;p.cd=0;hurt(p,18)}}
}
function size(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;D=1/3;for(const c of [cv,stain]){c.width=Math.ceil(W*D);c.height=Math.ceil(H*D)}g.setTransform(D,0,0,D,0,0);sg.setTransform(D,0,0,D,0,0)}
function reset(){
 spilled=false;P=[];S=[];drips=[];pool=0;drops=[];bombs=[];flashes=[];score=0;grabs.clear();sg.clearRect(0,0,W,H);
 const k=Math.max(.3,Math.min(W/330,H/430,1.4)),cx=W/2,top=H*.15;
 const pt=(x,y,r)=>{const p={x:cx+x*k,y:top+y*k,px:cx+x*k,py:top+y*k,r:r*k,cd:0};P.push(p);return p};
 const bone=(a,b,w,col)=>{const s={a,b,len:Math.hypot(a.x-b.x,a.y-b.y),w:w*k,col,cut:false,need:null,stiff:1};S.push(s);return s};
 const brace=(a,b,need,st)=>{const s=bone(a,b,0,null);s.need=need;s.stiff=st};
 const head=pt(0,0,22),neck=pt(0,30,8),hip=pt(0,110,12);
 const skin='#cfae7e',shirt='#6b7f3a',pants='#5a4632';
 const n=bone(head,neck,13,skin),t=bone(neck,hip,32,shirt);
 t.torso=true;brace(head,hip,[n,t],.15);
 for(const d of [-1,1]){
  const el=pt(d*38,55,8),ha=pt(d*68,82,9),kn=pt(d*20,165,9),ft=pt(d*28,222,11);
  const a1=bone(neck,el,14,shirt),a2=bone(el,ha,12,skin),l1=bone(hip,kn,18,pants),l2=bone(kn,ft,15,pants);
  brace(neck,ha,[a1,a2],.02);brace(hip,ft,[l1,l2],.05);brace(head,el,[n,a1],.01);brace(neck,kn,[t,l1],.04);
 }
 P[0].head=true;
 hud();
}
function hud(){if(score>best){best=score;try{localStorage.setItem('ragdollBest',Math.round(best))}catch(_){}}document.getElementById('score').textContent=Math.round(score);document.getElementById('best').textContent=Math.round(best)}
function bleed(x,y,n,vx=0,vy=0,sp=5){for(let i=0;i<n*2.5&&drops.length<1600;i++){const a=Math.random()*6.283,v=Math.random()*sp;drops.push({x,y,vx:vx+Math.cos(a)*v,vy:vy+Math.sin(a)*v-1,r:1.5+Math.random()*3})}}
function splat(x,y,r){sg.fillStyle=Math.random()<.5?'#6e000a':'#8f0310';const q=v=>Math.round(v/3)*3;
 for(let i=0;i<5;i++){const w=q(r*(.6+Math.random()))+3;sg.fillRect(q(x+(Math.random()-.5)*r*2.5),q(y+(Math.random()-.5)*r*1.6),w,w)}
 if(drips.length<60&&y<H-20&&Math.random()<.3)drips.push({x:q(x),y:q(y),t:20+Math.random()*80});
 if(y>H-8)pool=Math.min(22,pool+.06)}
function hurt(p,f){sfx('hit');score+=f;bleed(p.x,p.y,Math.min(40,f|0),0,0,Math.min(9,f/3));splat(p.x,p.y,Math.min(14,f/3));shake=Math.min(12,shake+f/5);if(navigator.vibrate)navigator.vibrate(15);hud()}
function sever(s,end){
 if(s.cut)return;s.cut=true;sfx('cut');if(s.torso)spill((s.a.x+s.b.x)/2,(s.a.y+s.b.y)/2);
 // stump: the bone stays on one end, a new point takes its other end
 const o=s[end],q={x:o.x,y:o.y,px:o.px+(Math.random()-.5)*6,py:o.py+3,r:s.w/2,cd:30,spurt:150};
 s[end]=q;P.push(q);o.spurt=150;
 for(const b of S)if(b.need&&b.need.includes(s))b.dead=true;
 S=S.filter(b=>!b.dead);hurt(o,40);
}
function spill(x,y){
 if(spilled)return;spilled=true;
 const k=Math.max(.5,Math.min(W/330,1.4));
 const mk=(r,kind)=>{const p={x:x+(Math.random()-.5)*20,y:y+(Math.random()-.5)*20,r:r*k,cd:20,organ:kind};p.px=p.x+(Math.random()-.5)*14;p.py=p.y+4+Math.random()*6;P.push(p);return p};
 mk(8,'heart');mk(10,'lung');mk(10,'lung');mk(11,'liver');
 let a=mk(5,'gut');for(let i=0;i<9;i++){const b=mk(5,'gut');S.push({a,b,len:9*k,w:8*k,col:'#d9707f',cut:true,need:null,stiff:.8});a=b}
 bleed(x,y,50,0,-2,8);
}
// splits a loose piece into two smaller pieces
function chop(s){
 if(s.len<18)return;
 const mx=(s.a.x+s.b.x)/2,my=(s.a.y+s.b.y)/2,mk=d=>{const p={x:mx,y:my,px:mx+d*3,py:my+3,r:s.w/2,cd:30,spurt:60};P.push(p);return p};
 const half=(a,b)=>S.push({a,b,len:s.len*.42,w:s.w,col:s.col,cut:false,need:null,stiff:1,safe:spin+60});
 for(const b of S)if(b.need&&b.need.includes(s))b.dead=true;
 S=S.filter(b=>b!==s&&!b.dead);half(s.a,mk(1));half(mk(-1),s.b);
 sfx('cut');hurt({x:mx,y:my},25);
}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function crosses(a,b,c,d){const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));return o(a,b,c)!==o(a,b,d)&&o(c,d,a)!==o(c,d,b)}
function slash(a,b){for(const s of S.slice())if(s.col&&!s.cut&&crosses(a,b,s.a,s.b)){
 // choose the end that is not already loose, so the limb really comes off
 const used=e=>S.filter(o=>o.col&&(o.a===s[e]||o.b===s[e])).length;
 const ea=used('a'),eb=used('b');if(s.torso)spill((s.a.x+s.b.x)/2,(s.a.y+s.b.y)/2);
 if(ea<2&&eb<2)chop(s);else sever(s,ea>=eb?'a':'b')}}
function shoot(x,y){sfx('gun');flashes.push({x,y,r:14,t:6});for(const s of S)if(s.col&&segDist(x,y,s.a.x,s.a.y,s.b.x,s.b.y)<s.w/2+10){
 for(const p of [s.a,s.b]){p.px-=(Math.random()-.5)*8;p.py+=5}
 bleed(x,y,30,0,-2,6);splat(x,y,7);s.a.spurt=Math.max(s.a.spurt||0,40);score+=15;shake=6;hud();return}}
function boom(x,y){
 sfx('boom');
 flashes.push({x,y,r:110,t:14});shake=18;
 for(const p of P){const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy)||1;if(d<170){const f=(1-d/170)*28;p.px-=dx/d*f;p.py-=dy/d*f;p.cd=0}}
 for(const s of S.slice())if(s.col&&!s.cut&&segDist(x,y,s.a.x,s.a.y,s.b.x,s.b.y)<65&&Math.random()<.7)sever(s,Math.random()<.5?'a':'b');
}
function step(){
 const held=new Set([...grabs.values()].map(v=>v.p).filter(Boolean));
 for(const p of P){
  const vx=(p.x-p.px)*.995,vy=(p.y-p.py)*.995;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+(zero?0:.45);
  if(spikes&&!p.cd&&p.y>H-26-p.r){p.cd=45;p.py=p.y+9;p.spurt=40;hurt(p,14)}
  if(p.cd>0)p.cd--;
  if(p.spurt>0){p.spurt--;if(p.spurt%2===0)bleed(p.x,p.y,2,vx*.5,vy*.5-1,3)}
 }
 if(blade){spin++;const c=saw();
  for(const s of S.slice())if(s.col&&!s.cut&&!(s.safe>spin)&&segDist(c.x,c.y,s.a.x,s.a.y,s.b.x,s.b.y)<c.r){const m={x:(s.a.x+s.b.x)/2,y:(s.a.y+s.b.y)/2};s.safe=spin+60;
   slash({x:m.x-(s.b.y-s.a.y),y:m.y+(s.b.x-s.a.x)},{x:m.x+(s.b.y-s.a.y),y:m.y-(s.b.x-s.a.x)});break}
 }
 const hits=new Map();
 for(let i=0;i<8;i++){
  for(const v of grabs.values())if(v.p){v.p.x+=(v.x-v.p.x)*.5;v.p.y+=(v.y-v.p.y)*.5}
  for(const s of S){const dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,d=Math.hypot(dx,dy)||.001,f=(d-s.len)/d*.5*s.stiff;s.a.x+=dx*f;s.a.y+=dy*f;s.b.x-=dx*f;s.b.y-=dy*f}
  for(const p of P){
   for(const [ax,vk,lim] of [['x','px',W],['y','py',H]]){
    const lo=p.r,hi=lim-p.r;
    if(p[ax]<lo||p[ax]>hi){
     const v=p[ax]-p[vk];if(i===0&&Math.abs(v)>11&&!p.cd)hits.set(p,Math.abs(v));
     p[ax]=p[ax]<lo?lo:hi;p[vk]=p[ax]+(i===0?v*.35:0);
     const other=ax==='x'?'py':'px',o=ax==='x'?'y':'x';p[other]+=(p[o]-p[other])*.12;
    }
   }
  }
 }
 for(const [p,v] of hits)if(!held.has(p)){p.cd=20;hurt(p,(v-9)*(p.head?3:2))}
 for(const d of drops){d.vy+=.35;d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>W||d.y>H-2){splat(Math.max(0,Math.min(W,d.x)),Math.min(H-2,d.y),d.r*1.4);d.dead=true;if(Math.random()<.08)sfx('drop')}}
 drops=drops.filter(d=>!d.dead);
 for(const b of bombs){b.vy+=.45;b.y=Math.min(H-12,b.y+b.vy);if(--b.t<=0)boom(b.x,b.y)}
 bombs=bombs.filter(b=>b.t>0);
 for(const f of flashes)f.t--;flashes=flashes.filter(f=>f.t>0);
 for(const d of drips){if(d.t%3<1){d.y+=3;sg.fillStyle='#6e000a';sg.fillRect(d.x,d.y,3,3)}d.t--}
 drips=drips.filter(d=>d.t>0);
 shake*=.85;
}
function circle(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,6.283);g.fill()}
function line(a,b,w,c){g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
function draw(){
 g.clearRect(0,0,W,H);g.save();g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 g.fillStyle='#241715';for(let y=0,r=0;y<H;y+=24,r++)for(let x=-(r%2)*24;x<W;x+=48)g.fillRect(x+3,y+3,42,18);
 g.drawImage(stain,0,0,stain.width/D,stain.height/D);
 if(spikes){g.fillStyle='#aab2bd';for(let x=0;x<W;x+=24){g.beginPath();g.moveTo(x,H);g.lineTo(x+12,H-26);g.lineTo(x+24,H);g.fill()}}
 for(const s of S)if(s.col){line(s.a,s.b,s.w+6,'#060303');line(s.a,s.b,s.w,s.col)}
 for(const p of P){
  if(p.spurt!==undefined)circle(p.x,p.y,Math.max(3,p.r*.8),'#8c0b14');
  if(p.head){circle(p.x,p.y,p.r,'#cfae7e');g.strokeStyle='#241a16';g.lineWidth=2;const e=p.r*.35;
   for(const d of [-1,1]){const x=p.x+d*e,y=p.y-3;g.beginPath();if(score>80){g.moveTo(x-3,y-3);g.lineTo(x+3,y+3);g.moveTo(x+3,y-3);g.lineTo(x-3,y+3)}else g.arc(x,y,2,0,6.283);g.stroke()}
   g.beginPath();g.arc(p.x,p.y+p.r*.45,p.r*.22,0,6.283);g.stroke()}
 }
 if(blade){const c=saw();g.fillStyle='#c5ccd5';g.beginPath();for(let i=0;i<32;i++){const a=spin*.4+i*Math.PI/16,r=i%2?c.r:c.r-8;g.lineTo(c.x+Math.cos(a)*r,c.y+Math.sin(a)*r)}g.fill();circle(c.x,c.y,7,'#2c323b')}
 for(const p of P)if(p.organ&&p.organ!=='gut'){const u=p.r/4,box=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(p.x+x*u,p.y+y*u,w*u,h*u)};
  if(p.organ==='heart'){box('#e01b2c',-4,-3,3,4);box('#e01b2c',1,-3,3,4);box('#e01b2c',-3,-1,6,4);box('#e01b2c',-1,3,2,2);box('#ff8a8a',-3,-2,1,1)}
  else if(p.organ==='lung'){box('#d98a8f',-3,-5,5,10);box('#d98a8f',2,-2,2,6);box('#a95560',-1,-3,1,6)}
  else{box('#6e2418',-5,-2,10,4);box('#6e2418',-4,-4,6,2);box('#8f3a25',-3,-3,3,1)}}
 g.fillStyle='#d4101c';for(const d of drops){const w=d.r>3?6:3;g.fillRect(d.x-w/2,d.y-w/2,w,w)}
 if(pool>1){g.fillStyle='#7d000c';g.fillRect(0,H-pool,W,pool);g.fillStyle='#c3121f';for(let x=0;x<W;x+=18)g.fillRect(x+(spikes?6:0),H-pool,9,3)}
 for(const b of bombs){circle(b.x,b.y,12,'#0c0d0f');circle(b.x,b.y-14,b.t%10<5?5:2,'#ffb020')}
 for(const f of flashes)circle(f.x,f.y,f.r*(1.2-f.t/20),'rgba(255,180,50,'+Math.min(.8,f.t/10)+')');
 g.restore();
 for(const v of grabs.values())if(v.trail)line(v.trail,v,4,'#dfe6ee');
}
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
 const m=pos(e);
 if(tool==='gun')shoot(m.x,m.y);
 else if(tool==='hammer')hammer(m.x,m.y);
 else if(tool==='bomb'){if(bombs.length<5)bombs.push({x:m.x,y:m.y,vy:0,t:60})}
 else{let best=null,bd=60;if(tool==='hand')for(const p of P){const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<bd){bd=d;best=p}}
  grabs.set(e.pointerId,{...m,p:best,trail:tool==='saw'?m:null})}
});
cv.addEventListener('pointermove',e=>{const v=grabs.get(e.pointerId);if(!v)return;const m=pos(e);if(v.trail){const a={x:v.x,y:v.y};slash(a,m);v.trail=a}v.x=m.x;v.y=m.y});
for(const n of ['pointerup','pointercancel'])cv.addEventListener(n,e=>grabs.delete(e.pointerId));
for(const b of document.querySelectorAll('nav [data-t]'))b.onclick=()=>{tool=b.dataset.t;grabs.clear();for(const o of document.querySelectorAll('nav [data-t]'))o.setAttribute('aria-pressed',o===b)};
document.getElementById('reset').onclick=reset;
function toggle(id,fn){const b=document.getElementById(id);b.onclick=()=>b.setAttribute('aria-pressed',fn(b))}
toggle('spikes',()=>spikes=!spikes);toggle('blade',()=>blade=!blade);toggle('grav',()=>zero=!zero);
toggle('snd',b=>{mute=!mute;b.textContent=mute?'Звук: выкл':'Звук: вкл';return mute});
let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);fit();if(!W||!H)return;acc+=Math.min(50,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60}draw()}
function fit(){const r=cv.getBoundingClientRect();if(r.width>0&&r.height>0&&(Math.abs(r.width-W)>1||Math.abs(r.height-H)>1)){size();reset()}}
requestAnimationFrame(loop);
</script>
