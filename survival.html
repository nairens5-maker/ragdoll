<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>body{margin:0}</style>
<title>Мёрзлый район</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap">
<style>
/* layout: status line, canvas, joystick + action buttons */
:root{--bg:#12171d;--fg:#e8edf0;--panel:#26313c;--red:#a52a22;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:600 14px "Pixelify Sans",monospace;display:flex;flex-direction:column;min-height:520px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
header,footer{flex:none;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stats{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
#msg{height:34px;overflow:hidden;font-size:13px;color:#ffd27a;line-height:1.2}
#wrap{flex:1;min-height:260px;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
footer{display:flex;gap:12px;align-items:center}
#joy{width:112px;height:112px;flex:none;border-radius:50%;background:var(--panel);position:relative;touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:#8d9aa6;pointer-events:none}
#btns{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
#btns button{font-size:12px;padding:0 2px}
.bar{flex:1 1 0;min-width:0;white-space:nowrap;font-size:12px}.bar i{display:block;height:7px;background:#000;border:1px solid #55687a}.bar b{display:block;height:100%}
#inv{width:100%;font-size:12px;line-height:1.3}
#craft{position:absolute;inset:0;overflow-y:auto;padding:10px 16px;background:#0b0f14f5;display:flex;flex-direction:column;gap:6px}
#craft button{flex:none;padding:6px 8px;text-align:left;line-height:1.25}
#craft button:disabled{opacity:.45}
button{min-height:38px;border:2px solid #55687a;background:var(--panel);color:var(--fg);font:inherit;touch-action:manipulation}
#btns #act{font-size:14px;grid-column:1/-1;background:var(--red);border-color:#e06a55;min-height:44px}
#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:#0b0f14e8;line-height:1.35}
#over button{padding:0 24px;min-height:48px}
</style>
<header><div id="stats"></div><div id="msg"></div></header>
<div id="wrap"><canvas id="c" aria-label="Карта города"></canvas>
<div id="craft" hidden style="display:none"></div>
<div id="over"><h2 id="ot">Мёрзлый район</h2><div id="od">Зима после катастрофы. Найди 5 деталей рации (мигают жёлтым на стрелке) и отнеси их к радиовышке в центре.<br><br>Следи за теплом, едой и водой. Обыскивай, руби деревья, мастери оружие в меню «Крафт». Ночью опаснее.</div><button id="go">Играть</button></div></div>
<footer><div id="joy"><div id="knob"></div></div><div id="btns">
<button id="act">Действие / Удар</button><button id="weap">Оружие</button><button id="mk">Крафт</button><button id="eat">Есть</button><button id="drink">Пить</button><button id="med">Лечиться</button><button id="snd">Звук: вкл</button></div></footer>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const T=16,N=72,SIZE=T*N,C=SIZE/2;
const WEAP={knife:{n:'Нож',dmg:1,r:28,cd:22},axe:{n:'Топор',dmg:2,r:30,cd:30},spear:{n:'Копьё',dmg:2,r:44,cd:28},gun:{n:'Самопал',dmg:4,r:120,cd:40}};
let bits=[],stains=[],shots=[],paused=false;
let p,obs,foes,fires,time,run=false,VW=200,VH=200,msgT=0,jx=0,jy=0,frame=0,mute=false,AC;
const keys={};
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function beep(f,len=.1,type='square',vol=.08){if(mute||!AC)return;const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+len);v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+len)}
function say(t){$('msg').textContent=t;msgT=240}
// solid footprint of each object, centred on x,y
const KIND={house:[96,48],kiosk:[32,24],car:[30,16],birch:[8,8],spruce:[10,10],tower:[20,20]};
function free(x,y,w,h,pad){return !obs.some(o=>Math.abs(o.x-x)<(o.w+w)/2+pad&&Math.abs(o.y-y)<(o.h+h)/2+pad)}
function place(kind,count,extra={}){const [w,h]=KIND[kind];const made=[];for(let i=0,n=0;i<4000&&n<count;i++){const x=rnd(60,SIZE-60),y=rnd(70,SIZE-60);if(Math.hypot(x-C,y-C)<80||!free(x,y,w,h,18))continue;const o={kind,x,y,w,h,looted:false,hp:3,...extra};obs.push(o);made.push(o);n++}return made}
function reset(){
 obs=[{kind:'tower',x:C,y:C-30,w:20,h:20}];foes=[];fires=[{x:C+28,y:C+10,life:3600}];time=0;
 bits=[];stains=[];shots=[];closeCraft();
 p={x:C,y:C+14,hp:100,food:100,water:100,warm:100,wood:3,scrap:0,cloth:0,ammo:0,raw:0,meat:0,bread:1,bottles:2,own:['knife'],w:'knife',cans:1,meds:1,parts:0,fx:0,fy:1,cd:0,hit:0,step:0};
 const houses=place('house',16),kiosks=place('kiosk',12),cars=place('car',26);
 place('birch',150);place('spruce',90);
 // five radio parts hidden in distinct containers
 const boxes=[...houses,...kiosks,...cars].sort(()=>Math.random()-.5);boxes.slice(0,5).forEach(o=>o.part=true);
 for(let i=0;i<14;i++)spawn();
 say('Найди 5 деталей рации. Жёлтая стрелка покажет путь.');
}
function spawn(){for(let i=0;i<50;i++){const x=rnd(20,SIZE-20),y=rnd(20,SIZE-20);if(Math.hypot(x-p.x,y-p.y)<190||Math.hypot(x-C,y-C)<140||!free(x,y,10,10,2))continue;const dog=Math.random()<.35;foes.push({x,y,dog,hp:dog?2:3,sp:dog?.85:.5,cd:0,hurt:0,wx:0,wy:0});return}}
function solid(x,y){if(x<6||y<6||x>SIZE-6||y>SIZE-6)return true;return !free(x,y,8,6,0)}
function move(e,dx,dy){if(!solid(e.x+dx,e.y))e.x+=dx;if(!solid(e.x,e.y+dy))e.y+=dy}
const near=(o,r)=>Math.abs(p.x-o.x)<o.w/2+r&&Math.abs(p.y-o.y)<o.h/2+r;
function act(){
 if(!run||paused||p.cd>0)return;p.cd=22;
 const W_=WEAP[p.w],loaded=p.w!=='gun'||p.ammo>0,reach=loaded?W_.r:20;
 let target=null,bd=reach;for(const f of foes){const d=dist(p,f);if(d<bd){bd=d;target=f}}
 if(target){const d=bd||1;p.fx=(target.x-p.x)/d;p.fy=(target.y-p.y)/d;p.cd=W_.cd;
  if(p.w==='gun'&&loaded){p.ammo--;shots.push({x:p.x,y:p.y-6,tx:target.x,ty:target.y-4,t:7});beep(130,.25,'sawtooth',.2)}else beep(160,.12);
  target.hp-=loaded?W_.dmg:1;target.hurt=10;move(target,p.fx*10,p.fy*10);blood(target.x,target.y,14,p.fx,p.fy);
  if(target.hp<=0){foes.splice(foes.indexOf(target),1);blood(target.x,target.y,30,p.fx,p.fy);stains.push({x:target.x,y:target.y+3,r:9});
   if(target.dog){p.raw++;say('Добыто сырое мясо. Пожарь его в крафте у костра.')}else{const c=Math.random()<.7,m=Math.random()<.5;if(c)p.cloth++;if(m)p.scrap++;say('Враг повержен.'+(c?' +ткань':'')+(m?' +металл':''))}}
  return}
 if(p.w==='gun'&&!loaded)say('Нет патронов. Сделай их в крафте.');
 if(near(obs[0],14)){if(p.parts>=5)return end(true,'Ты починил рацию и вызвал помощь!');return say('Радиовышка. Нужно деталей: '+(5-p.parts))}
 const o=obs.find(o=>o.kind!=='tower'&&near(o,12)&&!o.looted);
 if(!o)return say('Подойди к машине, дому, ларьку или дереву.');
 if(o.kind==='birch'||o.kind==='spruce'){o.hp-=p.w==='axe'?3:1;beep(110,.1,'sawtooth');if(o.hp<=0){obs.splice(obs.indexOf(o),1);p.wood+=3;say('+3 дров')}else say('Рубишь дерево…');return}
 o.looted=true;beep(520,.15);const got=[];
 if(o.part){p.parts++;got.push('ДЕТАЛЬ РАЦИИ ('+p.parts+'/5)')}
 const loot=(chance,key,n,name)=>{if(Math.random()<chance){p[key]+=n;got.push(name+' x'+n)}};
 const kiosk=o.kind==='kiosk',house=o.kind==='house',car=o.kind==='car';
 loot(kiosk?.8:.3,'cans',1,'тушёнка');loot(kiosk?.7:house?.5:.1,'bread',1,'сухари');loot(kiosk?.85:house?.6:.15,'bottles',kiosk?2:1,'вода');
 loot(house?.5:.1,'meds',1,'аптечка');loot(house?.7:.25,'cloth',2,'ткань');loot(car?.9:.3,'scrap',2,'металл');loot(.35,'wood',2,'дрова');loot(car?.3:.12,'ammo',2,'патроны');
 say(got.length?'Нашёл: '+got.join(', '):'Пусто.');
}
function use(key,stat,amount,text){p[key]--;p[stat]=Math.min(100,p[stat]+amount);beep(300);say(text)}
function eat(){if(!run||paused)return;if(p.meat)return use('meat','food',45,'Ты съел жареное мясо.');if(p.bread)return use('bread','food',18,'Ты погрыз сухари.');if(p.cans)return use('cans','food',35,'Ты съел тушёнку.');say(p.raw?'Мясо нужно пожарить у костра.':'Еды нет. Обыщи ларьки.')}
function drink(){if(!run||paused)return;if(p.bottles)return use('bottles','water',40,'Ты попил.');say('Воды нет. Растопи снег у костра (крафт).')}
function med(){if(!run||paused)return;if(!p.meds)return say('Нет аптечек. Сделай бинт из ткани.');use('meds','hp',45,'Ты подлечился.')}
function weapon(){if(!run||paused)return;p.w=p.own[(p.own.indexOf(p.w)+1)%p.own.length];beep(400,.06);say(p.own.length<2?'Пока есть только нож. Сделай оружие в крафте.':'В руках: '+WEAP[p.w].n)}
const atFire=()=>fires.some(f=>dist(p,f)<45);
const RECIPES=[
 {n:'Костёр',c:{wood:5},do:()=>fires.push({x:p.x+p.fx*16,y:p.y+p.fy*16,life:3600})},
 {n:'Растопить снег: вода',c:{wood:1},fire:true,do:()=>p.bottles++},
 {n:'Пожарить мясо',c:{raw:1},fire:true,do:()=>p.meat++},
 {n:'Бинт (аптечка)',c:{cloth:3},do:()=>p.meds++},
 {n:'Топор: сильный, быстро рубит',c:{wood:3,scrap:3},w:'axe'},
 {n:'Копьё: бьёт дальше',c:{wood:5,scrap:2,cloth:1},w:'spear'},
 {n:'Самопал: стреляет издалека',c:{wood:4,scrap:8,cloth:2},w:'gun'},
 {n:'Патроны x4',c:{scrap:2},do:()=>p.ammo+=4}];
const NAMES={wood:'дрова',scrap:'металл',cloth:'ткань',raw:'сырое мясо'};
function closeCraft(){paused=false;$('craft').hidden=true;$('craft').style.display='none'}
function craftMenu(){
 const box=$('craft');box.innerHTML='';
 const add=(text,off,fn)=>{const b=document.createElement('button');b.textContent=text;b.disabled=off;b.onclick=fn;box.appendChild(b)};
 add('✕ Закрыть крафт',false,closeCraft);
 for(const r of RECIPES){const has=r.w&&p.own.includes(r.w),cold=r.fire&&!atFire(),poor=Object.entries(r.c).some(([k,v])=>p[k]<v);
  add(r.n+' — '+(has?'уже есть':Object.entries(r.c).map(([k,v])=>NAMES[k]+' '+p[k]+'/'+v).join(', ')+(cold?' (нужен костёр рядом)':'')),has||cold||poor,()=>{for(const [k,v] of Object.entries(r.c))p[k]-=v;if(r.w){p.own.push(r.w);p.w=r.w}else r.do();beep(600,.15,'triangle');say('Готово: '+r.n);craftMenu()})}
}
function openCraft(){if(!run)return;if(paused)return closeCraft();paused=true;jx=jy=0;craftMenu();$('craft').hidden=false;$('craft').style.display=''}
function blood(x,y,n,dx=0,dy=0){for(let i=0;i<n&&bits.length<300;i++)bits.push({x,y:y+rnd(-2,3),z:rnd(3,11),vx:dx*rnd(0,1.6)+rnd(-1,1),vy:dy*rnd(0,1.6)+rnd(-.7,.7),vz:rnd(0,2),s:Math.random()<.3?3:2})}
function effects(){
 for(const b of bits){b.x+=b.vx;b.y+=b.vy;b.z+=b.vz;b.vz-=.16;if(b.z<=0){b.dead=true;stains.push({x:b.x,y:b.y,r:b.s})}}
 bits=bits.filter(b=>!b.dead);if(stains.length>600)stains.splice(0,stains.length-600);
 for(const q of shots)q.t--;shots=shots.filter(q=>q.t>0);
 for(const f of foes)if(f.hp<(f.dog?2:3)&&time%24===0)stains.push({x:f.x+rnd(-3,3),y:f.y+4,r:2});
 if(p.hp<35&&time%20===0)stains.push({x:p.x+rnd(-3,3),y:p.y+5,r:2});
}
function end(win,text){run=false;$('ot').textContent=win?'Ты выжил!':'Конец';$('od').textContent=text+' Прожито дней: '+(Math.floor(time/7200)+1)+'.';$('go').textContent='Играть снова';$('over').hidden=false;$('over').style.display=''}
// one day = 2 minutes; the second half gets dark
const dark=()=>Math.max(0,Math.min(1,-Math.sin(time/7200*Math.PI*2)*2));
function step(){
 time++;effects();if(p.cd>0)p.cd--;if(p.hit>0)p.hit--;if(msgT>0&&--msgT===0)$('msg').textContent='';
 let dx=jx+((keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)),dy=jy+((keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0));
 const m=Math.hypot(dx,dy);if(m>.15){const s=Math.min(1,m)*1.25*(p.food<15||p.water<15?.7:1);p.fx=dx/m;p.fy=dy/m;move(p,p.fx*s,p.fy*s);p.step++}
 const warm=fires.some(f=>dist(p,f)<45);
 p.warm=Math.max(0,Math.min(100,p.warm+(warm?.25:-(.012+dark()*.022))));
 p.food=Math.max(0,p.food-.011);p.water=Math.max(0,p.water-.015);if(p.water<=0)p.hp-=.04;
 if(p.warm<=0)p.hp-=.04;if(p.food<=0)p.hp-=.03;if(warm&&p.food>40&&p.water>40&&p.warm>60)p.hp=Math.min(100,p.hp+.02);
 for(const f of fires)f.life--;fires=fires.filter(f=>f.life>0);
 for(const f of foes){
  if(f.cd>0)f.cd--;if(f.hurt>0){f.hurt--;continue}
  const d=dist(f,p),see=d<(dark()>.4?150:100),scared=f.dog&&fires.some(x=>dist(f,x)<50);
  if(see&&!scared&&d>9)move(f,(p.x-f.x)/d*f.sp,(p.y-f.y)/d*f.sp);
  else{if(Math.random()<.01){f.wx=rnd(-.3,.3);f.wy=rnd(-.3,.3)}move(f,f.wx,f.wy)}
  if(d<12&&!f.cd&&!scared){f.cd=70;p.hp-=f.dog?7:10;p.hit=12;blood(p.x,p.y,10,(p.x-f.x)/(d||1),(p.y-f.y)/(d||1));beep(80,.2,'sawtooth',.15)}
 }
 if(time%400===0&&foes.length<14+dark()*14)spawn();
 if(p.hp<=0){p.hp=0;end(false,p.warm<=0?'Ты замёрз.':p.food<=0?'Ты умер от голода.':p.water<=0?'Ты умер от жажды.':'Силы оставили тебя.')}
}
const R=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
function drawObj(o,x,y){
 const l=x-o.w/2,t=y-o.h/2;
 if(o.kind==='house'){ // five-storey panel block
  R('#0003',l+6,t+6,o.w,o.h);R('#9a9c98',l,t-30,o.w,o.h+30);R('#5d6163',l,t-34,o.w,5);R('#eef4f7',l,t-36,o.w,3);
  for(let r=0;r<5;r++){R('#7d807d',l,t-27+r*14,o.w,1);for(let c=0;c<8;c++){const lit=(r*7+c*3+(o.x|0))%17===0;R(lit?'#f2b84b':(r+c)%5?'#28343f':'#4a5d6e',l+4+c*12,t-24+r*14,6,7)}}
  R(o.looted?'#222':'#7a3b25',x-6,t+o.h-14,12,14);R('#c9ccc8',x-9,t+o.h-17,18,3)}
 else if(o.kind==='kiosk'){R('#0003',l+4,t+4,o.w,o.h);R(o.looted?'#47606a':'#2f7d8c',l,t-6,o.w,o.h+6);R('#eef4f7',l-2,t-9,o.w+4,4);R('#e8e2c8',l+3,t-3,o.w-6,6);g.fillStyle='#8c1f1a';g.font='6px monospace';g.fillText('ПРОДУКТЫ',l+1,t+2);R('#1c2a31',l+5,t+7,o.w-10,9)}
 else if(o.kind==='car'){const c=o.looted?'#5f5148':['#a3402f','#c8bd8a','#3f6b52','#4a6486'][(o.x|0)%4];R('#0003',l+2,t+6,o.w,o.h-2);R(c,l,t+3,o.w,9);R(c,l+7,t-3,15,7);R('#9fc0cf',l+9,t-1,5,4);R('#9fc0cf',l+16,t-1,4,4);R('#15181b',l+3,t+10,6,5);R('#15181b',l+21,t+10,6,5);R('#e9eef0',l+8,t-5,13,2);R('#8a5a2c',l+(o.y|0)%18,t+6,4,3)}
 else if(o.kind==='birch'){R('#0002',x-4,y+1,12,4);R('#e4e6e0',x-2,y-22,4,26);for(let i=0;i<5;i++)R('#33373a',x-2+(i%2)*2,y-19+i*5,2,1);R('#4b3d33',x-8,y-24,6,1);R('#4b3d33',x+2,y-18,7,1);R('#4b3d33',x-6,y-12,4,1);R('#4b3d33',x-1,y-29,1,8);R('#eef4f7',x-8,y-26,5,2)}
 else if(o.kind==='spruce'){R('#0002',x-8,y+2,18,4);R('#4a3426',x-2,y-2,4,7);for(let i=0;i<4;i++){const w=22-i*5;R('#24493a',x-w/2,y-7-i*7,w,6);R('#dfeaef',x-w/2+1,y-8-i*7,w-2,2)}}
 else{for(let i=0;i<12;i++){const w=22-i*1.6;R('#b53a2c',x-w/2,y-i*7,2,8);R('#b53a2c',x+w/2-2,y-i*7,2,8);R(i%2?'#d8d8d8':'#b53a2c',x-w/2,y-i*7,w,1)}if(frame%60<30)R('#ff4a3a',x-2,y-84,4,4);g.fillStyle='#10151a';g.font='7px monospace';g.fillText('РАДИО',x-11,y+18)}
}
function person(x,y,coat,hat,walk,zombie){R('#0004',x-6,y+3,13,3);const k=(walk/6|0)%2,o='#11161b';
 R(o,x-5,y-1,5,7-k);R(o,x,y-1,5,6+k);R('#343b45',x-4,y,3,5-k);R('#343b45',x+1,y,3,4+k);
 R(o,x-6,y-10,12,12);R(coat,x-5,y-9,10,10);R('#0003',x+2,y-9,3,10);R('#1d222a',x-5,y-2,10,2);
 R(o,x-8,y-9,3,8);R(o,x+5,y-9,3,8);R(coat,x-7,y-8+(zombie?-2:k),2,5);R(coat,x+5,y-8+(zombie?-2:1-k),2,5);
 R(o,x-5,y-18,10,9);R(zombie?'#9db08a':'#e0b18c',x-4,y-14,8,5);R(hat,x-4,y-17,8,4);R(hat,x-5,y-15,2,5);R(hat,x+3,y-15,2,5);
 if(!zombie){R('#111',x-2,y-12,1,1);R('#111',x+1,y-12,1,1)}}
function draw(){

 for(const s of stains){const x=s.x-cx,y=s.y-cy;if(x<-12||y<-12||x>VW+12||y>VH+12)continue;R('#8e1118',x-s.r/2,y-s.r/4,s.r,Math.max(2,s.r/2));if(s.r>4){R('#6f0a10',x-s.r,y,s.r*2,3);R('#a3161d',x-2,y-4,6,9);R('#a3161d',x+s.r-1,y-4,3,2);R('#a3161d',x-s.r-2,y+4,3,2)}}

 for(const o of obs)if(Math.abs(o.x-p.x)<VW+60&&Math.abs(o.y-p.y)<VH+100)list.push([o.y+o.h/2,()=>drawObj(o,o.x-cx,o.y-cy)]);
 for(const f of fires)list.push([f.y,()=>{const x=f.x-cx,y=f.y-cy,k=frame/6&1;R('#5a3a24',x-7,y+1,14,3);R('#e2521d',x-4,y-6-k*2,8,8+k*2);R('#ffc23c',x-2,y-4,4,5)}]);
 for(const f of foes)list.push([f.y,()=>{const x=f.x-cx,y=f.y-cy,w=f.hurt>0;if(f.dog){R('#0003',x-6,y+3,13,3);R(w?'#fff':'#4a4038',x-6,y-4,12,6);const s=p.x>f.x?1:-1;R(w?'#fff':'#5c5046',x+s*6-3,y-8,6,6);R('#ff4a3a',x+s*7-1,y-6,2,2);R('#2b251f',x-5,y+2,2,3);R('#2b251f',x+3,y+2,2,3)}else{person(x,y,w?'#fff':'#56654a','#37402f',frame/2,true);R('#8e1118',x-3,y-6,3,4);R('#ff4a3a',x-2,y-11,1,2);R('#ff4a3a',x+1,y-11,1,2)}}]);
 list.push([p.y,()=>{const x=p.x-cx,y=p.y-cy;person(x,y,p.hit?'#ff6a5a':'#2f4d70','#6b4a2f',p.step);R('#b0302a',x-5,y-10,10,2);
 // weapon in hand, thrust forward while attacking
 const push=p.cd>12?6:0,len={knife:6,axe:10,spear:20,gun:11}[p.w];g.save();g.translate(Math.round(x+p.fx*(4+push)),Math.round(y-5+p.fy*(4+push)));g.rotate(Math.atan2(p.fy,p.fx));

 list.sort((a,b)=>a[0]-b[0]).forEach(i=>i[1]());

 if(dist(p,goal)>70){const a=Math.atan2(goal.y-p.y,goal.x-p.x),x=p.x-cx+Math.cos(a)*36,y=p.y-cy+Math.sin(a)*36;g.save();g.translate(x,y);g.rotate(a);g.fillStyle=frame%40<28?'#ffcc33':'#fff';g.beginPath();g.moveTo(7,0);g.lineTo(-4,-5);g.lineTo(-4,5);g.fill();g.restore()}

function hud(){$('stats').innerHTML=[['Жизнь',p.hp,'#d8433a'],['Тепло',p.warm,'#f09a2c'],['Еда',p.food,'#c9a24a'],['Вода',p.water,'#3f9fe0']].map(([n,v,c])=>`<span class="bar" style="color:${v<30?'#ff7a68':'inherit'}">${n} ${Math.ceil(v)}<i><b style="width:${v}%;background:${c}"></b></i></span>`).join('')+`<span id="inv">${WEAP[p.w].n}${p.w==='gun'?' ('+p.ammo+')':''} · Детали ${p.parts}/5 · День ${Math.floor(time/7200)+1}${dark()>.4?', ночь':''}<br>Дрова ${p.wood} · Металл ${p.scrap} · Ткань ${p.cloth} · Патроны ${p.ammo}<br>Тушёнка ${p.cans} · Сухари ${p.bread} · Мясо ${p.meat}+${p.raw} сыр. · Вода ${p.bottles} · Аптечки ${p.meds}</span>`}
function fit(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return false;const w=230,h=Math.round(w*r.height/r.width);if(w!==cv.width||h!==cv.height){cv.width=VW=w;cv.height=VH=h;g.imageSmoothingEnabled=false}return true}
let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);acc+=Math.min(50,t-last);last=t;if(!fit())return;while(acc>=1000/60){if(run&&!paused)step();acc-=1000/60}draw();if(frame%10===0)hud()}
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume()}catch(_){}}
addEventListener('touchend',audio,true);addEventListener('click',audio,true);

const tap=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();audio();fn()});

let jid=null;const joy=$('joy');
function stick(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-56)/40,y=(e.clientY-r.top-56)/40;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}jx=x;jy=y;$('knob').style.transform=`translate(${x*36}px,${y*36}px)`}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;try{joy.setPointerCapture(jid)}catch(_){}stick(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)stick(e)});
for(const n of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(n,e=>{if(e.pointerId===jid){jid=null;jx=jy=0;$('knob').style.transform=''}});

reset();requestAnimationFrame(loop);
